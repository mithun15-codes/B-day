<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>One last surprise</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Time for cake! 🎂</h1>
      <p class="lead">Close your eyes, make a wish, and tap the button!</p>
      <div class="cake-scene" id="cake">
        <div class="cake3d">
          <div class="candles">
            <div class="candle c1"><i class="flame"></i><i class="smoke"></i></div>
            <div class="candle c2"><i class="flame"></i><i class="smoke"></i></div>
            <div class="candle c3"><i class="flame"></i><i class="smoke"></i></div>
          </div>
          <div class="layer top"><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span><span class="drip d5"></span></div>
          <div class="layer bottom"><span class="sprinkle s1"></span><span class="sprinkle s2"></span><span class="sprinkle s3"></span><span class="sprinkle s4"></span><span class="sprinkle s5"></span></div>
          <div class="plate"></div>
        </div>
      </div>
      <div style="text-align: center">
        <button class="button" id="blowButton">Blow the candles 🕯️</button>
        <p class="lead" id="cakeMessage" aria-live="polite"></p>
      </div>
      <div class="card" style="text-align: center">
        <h2 style="color: var(--dark)">One last thing...</h2>
        <p>
          ജീവിതത്തിൽ ഒരുപാട് സന്തോഷങ്ങളും നല്ല നിമിഷങ്ങളും നിന്നെ തേടി വരട്ടെ.
          എന്നും ഇങ്ങനെ തന്നെ ചിരിച്ചുകൊണ്ടിരിക്കണം. ❤️
        </p>
      </div>
    </main>
  </body>
</html>
